[package]
name = "security-modeler"
# Release builds get their version from the git tag (see .github/workflows/release.yml).
version = "0.0.0"
edition = "2024"
description = "Security Modeler"
license-file = "../LICENSE"
publish = false

[[bin]]
name = "SecurityModeler"
path = "src/main.rs"

[dependencies]
getrandom = "0.4.3"
serde_json = "1.0.154"
sha2 = "0.11.1"
tao = "0.37.2"
tray-icon = "0.26.1"
ureq = "3.5.1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell"] }
zip = { version = "9.2.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[build-dependencies]
sha2 = "0.11.1"
winresource = "0.1.34"
zip = { version = "9.2.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
