[package]
name = "security-modeler"
# Must equal the VERSION file at the repository root (CI checks it). A push to main that changes VERSION
# publishes the release v<this> (.github/workflows/release.yml): python tools_dev/bump_version.py X.Y.Z.
version = "0.2.0"
edition = "2024"
description = "Security Modeler"
license-file = "../LICENSE"
publish = false

[[bin]]
name = "SecurityModeler"
path = "src/main.rs"

[dependencies]
getrandom = "0.4.3"
serde_json = "1.0.154"
sha2 = "0.11.1"
tao = "0.37.2"
tray-icon = "0.26.1"
ureq = "3.5.1"
zip = { version = "9.2.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell"] }

[target.'cfg(unix)'.dependencies]
ctrlc = { version = "3", features = ["termination"] }
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
libc = "0.2"
tar = { version = "0.4", default-features = false }

[build-dependencies]
sha2 = "0.11.1"
winresource = "0.1.34"
zip = { version = "9.2.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
