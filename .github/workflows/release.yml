name: Build and release

# Every push to main that changes the app is tested, built and released with the next version.
# Versions come from git tags (vX.Y.Z), so nothing is committed back. Pull requests are tested
# and built, and their exe is attached to the run, but not released.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  pull_request:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to raise. Auto reads the commit messages.
        type: choice
        options: [auto, patch, minor, major]
        default: auto

permissions:
  contents: write

# One release at a time, so two quick pushes can't claim the same version.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out the version
        id: version
        shell: bash
        env:
          BUMP: ${{ inputs.bump || 'auto' }}
          PR: ${{ github.event.number }}
        run: |
          set -euo pipefail
          last=$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)
          if [ -z "$last" ]; then base=0.0.0; range=HEAD; else base=${last#v}; range="$last..HEAD"; fi
          IFS=. read -r major minor patch <<< "$base"
          log=$(git log --format='%s%n%b' "$range")

          # Conventional commits: a breaking change raises major, feat: raises minor, anything else patch.
          bump=$BUMP
          if [ "$bump" = auto ]; then
            if grep -qE '^BREAKING CHANGE|^[a-z]+(\([^)]*\))?!:' <<< "$log"; then bump=major
            elif grep -qE '^feat(\([^)]*\))?:' <<< "$log"; then bump=minor
            else bump=patch; fi
          fi
          case $bump in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            *) patch=$((patch + 1)) ;;
          esac
          version="$major.$minor.$patch"
          # The first release starts at 0.1.0.
          if [ -z "$last" ] && [ "$bump" != major ]; then version=0.1.0; fi

          release=true
          if [ -n "$last" ] && [ "$(git rev-list --count "$range")" = 0 ]; then release=false; fi
          if [ -n "$PR" ]; then version="$version-pr.$PR"; release=false; fi

          echo "Previous: ${last:-none}, next: $version ($bump), release: $release"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Test the backend
        working-directory: backend
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the frontend
        working-directory: frontend
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm ci --no-fund --no-audit
          npm run build

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher

      - name: Build the launcher
        shell: bash
        working-directory: launcher
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # Only the package's own version line, the first in the file.
          sed -i "0,/^version = \".*\"/s//version = \"$VERSION\"/" Cargo.toml
          grep -m1 '^version' Cargo.toml
          cargo build --release
          mkdir -p ../dist
          cp target/release/SecurityModeler.exe ../dist/SecurityModeler.exe
          cd ../dist
          sha256sum SecurityModeler.exe > SecurityModeler.exe.sha256
          cat SecurityModeler.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: SecurityModeler-${{ steps.version.outputs.version }}
          path: dist/*

      - name: Publish the release
        if: github.event_name != 'pull_request' && steps.version.outputs.release == 'true' && !contains(github.event.head_commit.message, '[skip release]')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" dist/SecurityModeler.exe dist/SecurityModeler.exe.sha256 \
            --title "Security Modeler $VERSION" \
            --target "$GITHUB_SHA" \
            --generate-notes
