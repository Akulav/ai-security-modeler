name: Release

# Publishes a release by itself, the same way in all of Akulav's apps: a push to main that changes VERSION
# (python tools_dev/bump_version.py 0.3.0, fill in CHANGELOG.md, commit, push) runs the tests, builds the program for
# Windows, Linux and macOS (Apple Silicon) with the app inside, creates the tag v<VERSION> and publishes exactly three
# files, one per system, each both the install and the update:
#
#   SecurityModeler-Setup.exe     Windows x64 (Inno Setup: launcher/installer/security-modeler.iss)
#   SecurityModeler-linux-x64     Linux x64 (installs itself on its first start)
#   SecurityModeler-macos-arm64   macOS Apple Silicon (installs itself on its first start)
#
# Installed copies find the release by themselves and check the download against GitHub's SHA-256 digest of it
# (launcher/src/update.rs). A version that already has its tag is skipped, so nothing is published twice;
# "Run workflow" on the Actions page does the same for the current VERSION (e.g. after a failed run).

on:
  push:
    branches: [main]
    paths: [VERSION, .github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: New version?
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          v="$(tr -d ' \r\n' < VERSION)"
          c="$(sed -n 's/^version = "\(.*\)"/\1/p' launcher/Cargo.toml | head -n1)"
          echo "VERSION=$v Cargo.toml=$c"
          test "$v" = "$c" || { echo "::error::VERSION $v and launcher/Cargo.toml $c differ"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$v" > /dev/null; then
            echo "::notice::v$v is already released: nothing to publish (bump VERSION for a new release)"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
          echo "### Security Modeler $v (publish: $(grep publish "$GITHUB_OUTPUT" | cut -d= -f2))" >> "$GITHUB_STEP_SUMMARY"

  tests:
    name: Backend tests (${{ matrix.os }})
    needs: check
    if: needs.check.outputs.publish == 'true'
    strategy:
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - working-directory: backend
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest -q

  build:
    name: Build (${{ matrix.name }})
    needs: [check, tests]
    strategy:
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            bin: SecurityModeler.exe
            asset: SecurityModeler-Setup.exe   # (made by the setup step below: the only Windows file)
          - name: linux-x64
            # (the oldest supported Ubuntu: the program then runs on older Linux systems too)
            os: ubuntu-22.04
            bin: SecurityModeler
            asset: SecurityModeler-linux-x64
          - name: macos-arm64
            # (Apple Silicon; the linker gives an arm64 program the ad-hoc signature macOS needs to run it)
            os: macos-15
            bin: SecurityModeler
            asset: SecurityModeler-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux desktop libraries (GTK, app indicator)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libxdo-dev libayatana-appindicator3-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the frontend
        working-directory: frontend
        shell: bash
        env:
          APP_VERSION: ${{ needs.check.outputs.version }}
        run: |
          npm ci --no-fund --no-audit
          npm run build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher
      - name: Build the program (the app is packed inside)
        working-directory: launcher
        run: cargo build --release --locked
      - name: Name it for the release
        shell: bash
        run: |
          mkdir -p dist
          ./launcher/target/release/${{ matrix.bin }} --version || true
          if [ "${{ runner.os }}" != "Windows" ]; then
            cp "launcher/target/release/${{ matrix.bin }}" "dist/${{ matrix.asset }}"
            chmod +x "dist/${{ matrix.asset }}"
          fi
      - name: Windows setup (SecurityModeler-Setup.exe, with its uninstaller)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc /Qp "/DAppVersion=${{ needs.check.outputs.version }}" "/DExe=$PWD\launcher\target\release\SecurityModeler.exe" "/O$PWD\dist" launcher\installer\security-modeler.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: One file per system
        shell: bash
        run: |
          ls -la dist
          (( $(ls dist | wc -l) == 1 )) || { echo "::error::a build must give exactly one release file"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish the release
    needs: [check, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Three files, one per system
        run: |
          cd dist && sha256sum *
          (( $(ls | wc -l) == 3 )) || { echo "::error::expected 3 release files"; exit 1; }
      - name: Release notes (downloads + CHANGELOG.md)
        env:
          VERSION: ${{ needs.check.outputs.version }}
          BASE: https://github.com/${{ github.repository }}/releases/download/v${{ needs.check.outputs.version }}
        run: |
          {
            echo "## Security Modeler $VERSION"
            echo
            echo "_Made by **Akulav**: local only, no telemetry, no cloud._"
            echo
            echo "One file per system. The same file installs the app and later updates it."
            echo
            echo "| System | Download | First start |"
            echo "| --- | --- | --- |"
            echo "| Windows 10/11 (x64) | [SecurityModeler-Setup.exe]($BASE/SecurityModeler-Setup.exe) | Asks where to install (no admin rights). Updates reuse that folder. |"
            echo "| Linux x64 | [SecurityModeler-linux-x64]($BASE/SecurityModeler-linux-x64) | \`chmod +x\` it and run it: it installs itself. |"
            echo "| macOS Apple Silicon | [SecurityModeler-macos-arm64]($BASE/SecurityModeler-macos-arm64) | \`chmod +x\`, then right-click → Open: it installs itself. |"
            echo
            echo "Installed copies update themselves from the app (or its tray icon), checked against GitHub's SHA-256 of each file."
            echo
            awk -v v="$VERSION" '$0 ~ "^## \\[?"v"\\]?" {on=1; next} on && /^## / {exit} on {print}' CHANGELOG.md
            echo
            echo "<details><summary>SHA-256 checksums</summary>"
            echo
            echo '```'
            (cd dist && sha256sum *)
            echo '```'
            echo "</details>"
          } > notes.md
          cat notes.md
      - name: Tag and publish (the tag v<VERSION> is created on this commit)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Security Modeler ${{ needs.check.outputs.version }}
          body_path: notes.md
          files: dist/*
          fail_on_unmatched_files: true
          make_latest: true
